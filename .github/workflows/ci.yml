name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI (Cloud Functions & Emulators)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin for Firebase Emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install backend dependencies
        run: npm ci --prefix functions

      - name: Check TypeScript types
        run: npm run typecheck --prefix functions

      - name: Compile Cloud Functions
        run: npm run build --prefix functions

      - name: Run Backend Unit Tests (Vitest)
        run: npm test --prefix functions

      - name: Run Firebase Emulator Integration Tests
        run: firebase emulators:exec --project demo-maanaim --only auth,firestore,storage,functions "npm run test:emulator --prefix functions"

  frontend:
    name: Frontend CI (Flutter Web & Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Install Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Run Flutter Static Analysis
        working-directory: flutter_app
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Flutter Test Suite
        working-directory: flutter_app
        run: flutter test
