<!DOCTYPE html>
<html lang="pt-BR"><head><base href="$FLUTTER_BASE_HREF"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#005BD8"><meta name="description" content="Gestão de voluntários do Maanaim"><title>Maanaim</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Maanaim"><script>
  if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
    self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
  }
  function imprimirDocumentoHtml(htmlContent) {
    const frame = document.createElement('iframe');
    frame.style.position = 'fixed';
    frame.style.right = '0';
    frame.style.bottom = '0';
    frame.style.width = '0';
    frame.style.height = '0';
    frame.style.border = '0';
    document.body.appendChild(frame);
    frame.contentWindow.document.open();
    frame.contentWindow.document.write(htmlContent);
    frame.contentWindow.document.close();
    frame.contentWindow.focus();
    setTimeout(function() {
      frame.contentWindow.print();
      setTimeout(function() {
        document.body.removeChild(frame);
      }, 1000);
    }, 300);
  }
</script></head><body><script src="flutter_bootstrap.js" async></script></body></html>
