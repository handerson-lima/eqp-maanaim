publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^5.3.3
  firebase_app_check: ^0.3.2+10
  firebase_core: ^3.8.0
